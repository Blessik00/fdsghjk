name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pulsepvp-jar
          path: out/pulsepvp-1.1.0.jar
